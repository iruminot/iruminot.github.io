<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<div style="font:500 14px/1.4 'IBM Plex Sans',system-ui,sans-serif;padding:10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--panel);display:flex;flex-wrap:wrap;gap:6px 18px"><a href="../../../../" style="color:var(--ink);text-decoration:none;font-weight:600">Ignacio Ruminot Aburto</a><a href="../" style="color:var(--accent)">← Cálculo II: unidades</a><a href="../../../" style="color:var(--accent)">Docencia</a></div>
<title>Laboratorio · Cálculo II</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: banco de trabajo — panel de controles fijo a la izquierda, dos vistas (plano / espacio) lado a lado, resultados y convergencia debajo */
:root{
  --bg:#f5f6f8; --panel:#ffffff; --ink:#16202c; --muted:#5a6573; --line:#dce1e8;
  --accent:#2563c9; --accent-weak:#e2ebfa; --edge:#c2410c; --edge-weak:rgba(194,65,12,.55);
  --region:rgba(37,99,201,.10); --grid:rgba(22,32,44,.22);
  --display:"Spectral", Georgia, "Times New Roman", serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1318; --panel:#171c23; --ink:#e4e9f0; --muted:#97a2b1; --line:#2a323d;
  --accent:#6ea6f2; --accent-weak:#1a2940; --edge:#f08a4b; --edge-weak:rgba(240,138,75,.6);
  --region:rgba(110,166,242,.12); --grid:rgba(228,233,240,.20); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f1318; --panel:#171c23; --ink:#e4e9f0; --muted:#97a2b1; --line:#2a323d;
  --accent:#6ea6f2; --accent-weak:#1a2940; --edge:#f08a4b; --edge-weak:rgba(240,138,75,.6);
  --region:rgba(110,166,242,.12); --grid:rgba(228,233,240,.20); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1440px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:20px}
.eyebrow{font:500 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:600 clamp(26px,3.4vw,36px)/1.1 var(--display);margin:6px 0 0;text-wrap:balance}
h2{font:600 19px/1.25 var(--display);margin:0;text-wrap:balance}
h3{font:600 13px/1.2 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
.lede{max-width:62ch;color:var(--muted);margin:0}
.layout{display:grid;grid-template-columns:310px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
aside.panel{position:sticky;top:12px;display:flex;flex-direction:column;gap:18px}
@media (max-width:980px){aside.panel{position:static}}
.group{display:flex;flex-direction:column;gap:8px}
label{font-size:13px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input[type=text],select{width:100%;font:15px var(--mono);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
select{font-family:var(--body)}
input[type=text]:focus,select:focus,button:focus-visible,input[type=range]:focus-visible,input[type=checkbox]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=text].bad{border-color:var(--edge)}
.err{color:var(--edge);font-size:13px;min-height:0}
.slider{display:grid;grid-template-columns:auto 1fr 3ch;align-items:center;gap:10px;font:14px var(--mono)}
.slider output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.check input{accent-color:var(--accent);width:16px;height:16px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button{font:500 14px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.seg button{font-size:13px;padding:6px 8px;text-align:left}
.seg button[aria-pressed=true]{background:var(--accent-weak);border-color:var(--accent);color:var(--ink)}
.hint{font-size:13px;color:var(--muted);margin:0}
.region-desc{font:14px var(--mono);color:var(--ink);background:var(--bg);border-radius:6px;padding:8px 10px;overflow-x:auto}

main{display:flex;flex-direction:column;gap:20px;min-width:0}
.views{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px}
.view{display:flex;flex-direction:column;gap:10px;min-width:0}
.view-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.canvas-box{position:relative;width:100%;min-width:0}
#c2d{display:block;width:100%;touch-action:none;cursor:crosshair}
#c3d{display:block;width:100%;height:440px;border-radius:6px;overflow:hidden;cursor:grab}
#c3d canvas{display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}
.sw.hatch{background:repeating-linear-gradient(45deg,var(--edge) 0 2px,transparent 2px 5px);border:1px solid var(--edge)}
.sw.region{background:var(--region);border:1.5px solid var(--ink)}
.cbar{display:inline-block;width:90px;height:10px;border-radius:2px;vertical-align:middle;margin:0 6px}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:12.5px/1.45 var(--mono);color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.12);white-space:nowrap;z-index:5}
.tip b{font-family:var(--body);font-weight:600}

.results{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px}
@media (max-width:820px){.results{grid-template-columns:minmax(0,1fr)}}
.big{font:500 clamp(28px,4vw,40px)/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px;align-items:baseline}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font:14px var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.pill{display:inline-block;font:500 12px var(--body);padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
.pill.good{color:#0b7a0b;border-color:#0b7a0b}
.pill.mid{color:var(--edge);border-color:var(--edge)}
.formula{overflow-x:auto;overflow-y:hidden;font-size:15px}
.subst{font:14px var(--mono);color:var(--muted);overflow-x:auto;white-space:nowrap}
.subst b{color:var(--ink);font-weight:500}
#conv{display:block;width:100%;height:280px;touch-action:none}
details summary{cursor:pointer;color:var(--accent);font-size:14px}
.tablebox{overflow-x:auto;max-height:280px;overflow-y:auto;margin-top:8px}
table{border-collapse:collapse;font:13px var(--mono);font-variant-numeric:tabular-nums;width:100%}
th,td{padding:4px 10px;text-align:right;border-bottom:1px solid var(--line)}
th{font-family:var(--body);font-weight:600;color:var(--muted);position:sticky;top:0;background:var(--panel)}
tr.cur td{background:var(--accent-weak)}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:20px}
.notes p{margin:6px 0 0;max-width:65ch}
.mono{font-family:var(--mono)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* ---------- sitio: pestañas ---------- */
:root{--num:#c4501a;--re:#c4501a;--im:#1f8a5a}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--num:#f39a62;--re:#f39a62;--im:#5cc493} }
:root[data-theme="dark"]{--num:#f39a62;--re:#f39a62;--im:#5cc493}
.site-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:8px 24px;margin-bottom:14px}
.site-head h1{margin-top:4px}
.coursetabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
.coursetabs a{display:flex;flex-direction:column;gap:2px;padding:10px 16px 11px;text-decoration:none;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px;border-radius:6px 6px 0 0}
.coursetabs a .code{font:500 11.5px/1 var(--mono);letter-spacing:.04em}
.coursetabs a .name{font:600 16px/1.2 var(--display);color:inherit}
.coursetabs a:hover{color:var(--ink);background:var(--panel)}
.coursetabs a[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.coursetabs a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.topics{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.topics .lbl{font-size:13px;color:var(--muted);margin-right:4px}
.topics a{font:500 13.5px var(--body);text-decoration:none;color:var(--ink);padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:var(--panel)}
.topics a[aria-current=page]{background:var(--accent-weak);border-color:var(--accent)}
.topics .soon{font-size:13px;color:var(--muted);padding:5px 4px}
.course > header{margin-bottom:20px}

/* ---------- EDO ---------- */
.edo{display:flex;flex-direction:column;gap:20px}
.model{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px 28px;align-items:start}
@media (max-width:900px){.model{grid-template-columns:minmax(0,1fr)}}
.model p{margin:0 0 8px;max-width:65ch}
.regimes{width:100%;border-collapse:collapse;font-size:14px}
.regimes td,.regimes th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-family:var(--body)}
.regimes th{position:static;background:none}
.regimes td:first-child{white-space:nowrap}
.probgroups{display:flex;flex-wrap:wrap;gap:12px 32px}
.probgroup{display:flex;flex-direction:column;gap:6px;min-width:0}
.probgroup .lbl{font:500 12px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.probbar{display:flex;flex-wrap:wrap;gap:8px}
.dp{display:flex;flex-direction:column;gap:20px}
.dp-grid{display:grid;grid-template-columns:minmax(0,0.9fr) minmax(0,1.2fr);gap:20px;align-items:start}
@media (max-width:1100px){.dp-grid{grid-template-columns:minmax(0,1fr)}}
#dpc{display:block;width:100%}
.dp-ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px 24px}
.dp-ctl .slider{grid-template-columns:3.6em 1fr 10ch}
.dp-ctl .slider output{font-size:12.5px}
.dpcharts{grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
#dppre button{font-size:13px;padding:6px 10px}
.analog{margin:0;padding:10px 14px;border-radius:8px;border:1px dashed var(--accent);max-width:68ch;font-size:14.5px}
.ctxfig{display:block;width:100%;max-width:270px;height:auto;color:var(--ink);font:italic 600 15px Spectral, Georgia, serif}
.ctxfig path,.ctxfig circle{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ctxfig text{fill:var(--ink)}
.ctxfig text.muted{fill:var(--muted);font:12px "IBM Plex Sans", sans-serif}
.ctxfig .acc{stroke:var(--accent)}
.ctxfig .dash{stroke:var(--muted);stroke-dasharray:4 4;stroke-width:1.2}
.ctxfig circle.bob,.ctxfig rect.body{fill:var(--accent-weak);stroke:var(--ink);stroke-width:2}
.ctxfig rect.water{fill:var(--accent-weak);stroke:none}
.analogies{width:100%;border-collapse:collapse;font-size:14px}
.analogies td,.analogies th{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;font-family:var(--body);white-space:nowrap}
.analogies th{position:static;background:none}
.analogies td:first-child{color:var(--muted)}
.probbar button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 14px;border-radius:8px;background:var(--panel)}
.probbar button small{font:12px var(--body);color:var(--muted)}
.probbar button[aria-pressed=true]{background:var(--accent-weak);border-color:var(--accent)}
.edo-top{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start}
.edo-side{position:sticky;top:12px;display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:1100px){.edo-side{position:static}}
.edo-side .edo-ctl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 22px;align-items:center}
.edo-side .edo-ctl > h3,.edo-side .edo-ctl > .field,.edo-side .edo-ctl > .hint,.edo-side .edo-ctl > #setres{grid-column:1/-1}
@media (max-width:560px){.edo-side .edo-ctl{grid-template-columns:minmax(0,1fr)}}
@media (max-width:1100px){.edo-top{grid-template-columns:minmax(0,1fr)}}
.worked{display:flex;flex-direction:column;gap:12px}
.worked .stmt{margin:0;padding:10px 14px;border-left:3px solid var(--line);color:var(--ink);font-size:14.5px;max-width:68ch}
.worked ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px}
.worked li{max-width:68ch}
.worked .ans{background:var(--accent-weak);border-radius:8px;padding:10px 14px}
.worked .ans p{margin:4px 0}
.worked mjx-container[display=true]{overflow-x:auto;overflow-y:hidden;max-width:100%}
.datos{display:flex;flex-wrap:wrap;gap:6px}
.datos span{font:13px var(--mono);padding:3px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.modbanner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:13.5px;padding:8px 12px;border:1px solid var(--num);border-radius:8px;color:var(--ink)}
.sim{display:flex;flex-direction:column;gap:12px}
.simgrid{display:grid;grid-template-columns:minmax(200px,0.38fr) minmax(0,1.62fr);gap:18px;align-items:start}
@media (max-width:560px){.simgrid{grid-template-columns:minmax(0,1fr)}}
#spring{display:block;width:100%}
.transport{display:grid;grid-template-columns:auto auto 1fr auto;gap:10px;align-items:center}
.transport select{width:auto;font:13px var(--body);padding:5px 6px}
.transport output{font:13px var(--mono);font-variant-numeric:tabular-nums;min-width:8ch;text-align:right}
.viewtabs{display:flex;gap:4px}
.viewtabs button{font-size:13px;padding:4px 10px}
.viewtabs button[aria-pressed=true]{background:var(--accent-weak);border-color:var(--accent)}
canvas.chart{display:block;width:100%;touch-action:none}
.edo-mid{display:grid;grid-template-columns:310px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:980px){.edo-mid{grid-template-columns:minmax(0,1fr)}}
.edo-ctl{display:flex;flex-direction:column;gap:14px}
.edo-ctl .slider{grid-template-columns:5.2em 1fr 7ch}
.edo-ctl .slider label{font-family:var(--mono);color:var(--ink);font-size:13px}
.edo-ctl .slider output{font-size:13px}
.edo-res{display:flex;flex-direction:column;gap:20px;min-width:0}
.cards3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px}
.helix{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:980px){.helix{grid-template-columns:minmax(0,1fr)}}
.helix-3d{display:flex;flex-direction:column;gap:10px;min-width:0}
.helix-text{display:flex;flex-direction:column;gap:10px;min-width:0}
.helix-text p,.helix-text ul{margin:0;max-width:62ch}
.helix-text ul{padding-left:20px;display:flex;flex-direction:column;gap:6px}
#helix3d{width:100%;height:clamp(340px,40vw,540px);border-radius:6px;overflow:hidden;cursor:grab;border:1px solid var(--line)}
#helix3d canvas{display:block}
#hxviews button{font-size:13px;padding:6px 10px}
#hxviews button[aria-pressed=true]{background:var(--accent-weak);border-color:var(--accent)}
#hxtime{font:13px var(--mono);font-variant-numeric:tabular-nums}
.cardhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.pill.reg{font-size:13px;padding:3px 10px;border-color:var(--accent);color:var(--ink);background:var(--accent-weak)}
.warn{font-size:13.5px;color:var(--num);margin:0}
.methods{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:20px;align-items:start}
@media (max-width:900px){.methods{grid-template-columns:minmax(0,1fr)}}
.methods .formula{font-size:14px}
.mtable td:first-child,.mtable th:first-child{text-align:left;font-family:var(--body)}
.algo{grid-column:1/-1;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.algohead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.algogrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 28px}
@media (max-width:900px){.algogrid{grid-template-columns:minmax(0,1fr)}}
.algo-code{margin:0;padding:12px 14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;font:13px/1.6 var(--mono);color:var(--ink);overflow-x:auto;white-space:pre}
.algo-code .cm{color:var(--muted)}
#algoidea p,.algofirst p{margin:4px 0;max-width:72ch;font-size:14.5px}
.algofirst{font-size:14.5px}
#algotable td,#algotable th{white-space:nowrap}
.mtable tr.sel td{background:var(--accent-weak)}
.sw.num{background:var(--num)}
.sw.acc{background:var(--accent)}
#rescard{display:flex;flex-direction:column;gap:12px}
#rescard h2{margin:0}
#rescard h3{margin:14px 0 6px}
.resgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 32px}
@media (max-width:980px){.resgrid{grid-template-columns:minmax(0,1fr)}}
.resgrid p{margin:6px 0;max-width:68ch}
.reslist{margin:6px 0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.resgrid mjx-container[display=true]{overflow-x:auto;overflow-y:hidden;max-width:100%}
.rescheck{border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-top:10px}
.rescheck h3{margin-top:0}
.rq{display:grid;grid-template-columns:minmax(0,1fr) 7em;gap:10px;align-items:center;margin:6px 0;font-size:14px}
.rq input{font:14px var(--mono);padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.rq input.good{border-color:var(--im)}.rq input.bad{border-color:var(--num)}
.rqmsg{font-size:13.5px;font-weight:500}
.worked ol.vars{background:var(--accent-weak);border-radius:8px;padding:10px 14px 10px 34px;margin:0}
.algo .solh,.worked .solh{font:600 13px/1.2 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:14px 0 4px}
.worked details.sol ul{margin:4px 0;padding-left:20px;display:flex;flex-direction:column;gap:5px;max-width:68ch}
.sw.env{background:none;border-top:2px dashed var(--muted);border-radius:0;height:0;width:16px;vertical-align:3px}
/* ---------- Fundamentos de Matemática 2 ---------- */
.vf{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;font-size:14px}
.vf button[aria-pressed=true]{background:var(--accent-weak);border-color:var(--accent)}
.vfmsg{font-size:13.5px;font-weight:500}
.vfmsg.ok{color:var(--im)}
.vfmsg.no{color:var(--num)}
details.sol{border-top:1px solid var(--line);padding-top:8px}
details.sol[open] summary{margin-bottom:8px}

const SUC=[
 {name:'(3n² + 1)/(2n² − n)',f:n=>(3*n*n+1)/(2*n*n-n),L:1.5,tex:R`a_n=\frac{3n^2+1}{2n^2-n}`,note:R`Se dividen numerador y denominador por \(n^2\): \(a_n=\dfrac{3+1/n^2}{2-1/n}\to\dfrac32\).`},

const S1={i:0,N:60,le:-1};
const EX1={title:'Límite de una sucesión: la definición ε–N',
 stmt:R`<p>Una sucesión \((a_n)\) converge a \(L\) si para todo \(\varepsilon>0\) existe \(N\) tal que \(|a_n-L|<\varepsilon\) para todo \(n\ge N\). En la figura, la franja es \(L\pm\varepsilon\): desde \(N\) en adelante, todos los puntos quedan adentro.</p>
 <p><b>Ejercicio.</b> Sea \(a_n=\dfrac{3n^2+1}{2n^2-n}\).</p><ol class="parts" type="a"><li>Calcule \(L=\lim a_n\).</li><li>Encuentre el menor \(N\) tal que \(|a_n-L|<0.01\) para todo \(n\ge N\).</li></ol>`,
 checks:[{label:'(a) L',val:1.5},{label:'(b) N para ε = 0.01',val:77}],
 sol:R`<h4 class="solh">Fundamento</h4>
 <ul><li><b>Álgebra de límites:</b> si \(b_n\to B\) y \(c_n\to C\ne0\), entonces \(b_n/c_n\to B/C\).</li>
 <li><b>Límites básicos:</b> \(1/n\to0\) y \(1/n^2\to0\).</li>
 <li><b>Definición ε–N:</b> para probar que \(N\) sirve, hay que mostrar que la desigualdad se cumple para <i>todos</i> los \(n\ge N\), no solo para \(n=N\).</li></ul>
 <h4 class="solh">Desarrollo</h4>
 <p><b>(a)</b> Numerador y denominador crecen como \(n^2\), así que dividimos ambos por \(n^2\), la mayor potencia del denominador:</p>
 \[ a_n=\frac{3n^2+1}{2n^2-n}=\frac{3+\frac{1}{n^2}}{2-\frac1n}. \]
 <p>Cuando \(n\to\infty\), el numerador tiende a \(3\) y el denominador a \(2\ne0\). Por el álgebra de límites, \(L=\tfrac32\).</p>
 <p><b>(b)</b> <i>Paso 1: calcular la distancia al límite.</i></p>
 \[ a_n-\frac32=\frac{2(3n^2+1)-3(2n^2-n)}{2(2n^2-n)}=\frac{3n+2}{2n(2n-1)}. \]
 <p>Para \(n\ge1\) esta fracción es positiva, así que \(|a_n-\tfrac32|=\dfrac{3n+2}{2n(2n-1)}\). Además, \(a_n\) se acerca a \(\tfrac32\) <i>por arriba</i>.</p>
 <p><i>Paso 2: resolver la desigualdad.</i> Como los denominadores son positivos, se puede multiplicar sin cambiar el sentido:</p>
 \[ \frac{3n+2}{2n(2n-1)}<\frac1{100}\iff 100(3n+2)<2n(2n-1)\iff 4n^2-302n-200>0. \]
 <p>Las raíces de \(4n^2-302n-200\) son \(n=\dfrac{302\pm\sqrt{302^2+3200}}{8}\), es decir \(n\approx-0.66\) y \(n\approx76.16\). La parábola es positiva fuera de las raíces, así que la desigualdad vale para \(n>76.16\).</p>
 <p><i>Paso 3: comprobar los bordes.</i></p>
 <ul><li>\(n=76\): \(\dfrac{230}{2\cdot76\cdot151}\approx0.01002>0.01\), así que \(N=76\) no sirve.</li>
 <li>\(n=77\): \(\dfrac{233}{2\cdot77\cdot153}\approx0.00989<0.01\).</li>
 <li>Para \(n\ge77\) la distancia sigue bajando, porque el numerador crece linealmente y el denominador cuadráticamente.</li></ul>

 <ul><li><b>N depende de ε.</b> Para \(n\) grande, \(|a_n-L|\approx\dfrac{3n}{4n^2}=\dfrac{3}{4n}\), así que \(N\approx\dfrac{3}{4\varepsilon}\): una tolerancia 10 veces menor exige unas 10 veces más términos. Eso mide qué tan <i>rápido</i> converge la sucesión.</li>

 <li><b>En la figura.</b> Con ε = 0.01, la línea vertical queda en \(n=77\). Achique ε y vea cómo se corre hacia la derecha.</li></ul>`};

 <p><b>Ejercicio.</b></p><ol class="parts" type="a"><li>Para \(\sum_{n\ge1}\frac{1}{n(n+1)}\), calcule \(S_{10}\).</li><li>Calcule la suma de esa serie.</li><li>Calcule \(\sum_{n=1}^{\infty}\frac{3}{4^n}\).</li></ol>`,

 <ul><li><b>Definición:</b> \(\sum_{n=1}^\infty a_n=\lim_{N\to\infty}S_N\). Para sumar una serie hay que obtener una fórmula cerrada para \(S_N\) y luego tomar el límite.</li>
 <li><b>Serie geométrica:</b> \(S_N=a+ar+\dots+ar^{N-1}=a\,\dfrac{1-r^N}{1-r}\) (multiplique \(S_N\) por \(r\) y reste). Si \(|r|<1\), \(r^N\to0\) y la suma es \(\dfrac{a}{1-r}\).</li>
 <li><b>Serie telescópica:</b> si \(a_n=b_n-b_{n+1}\), los términos intermedios se cancelan y \(S_N=b_1-b_{N+1}\).</li></ul>
 <h4 class="solh">Desarrollo</h4>
 <p><b>(a)</b> <i>Fracciones parciales.</i> \(\dfrac{1}{n(n+1)}=\dfrac An+\dfrac B{n+1}\) da \(1=A(n+1)+Bn\). Con \(n=0\), \(A=1\); con \(n=-1\), \(B=-1\). Entonces</p>
 \[ S_N=\left(1-\tfrac12\right)+\left(\tfrac12-\tfrac13\right)+\cdots+\left(\tfrac1N-\tfrac1{N+1}\right)=1-\frac1{N+1},\qquad S_{10}=1-\frac1{11}=\frac{10}{11}. \]
 <p><b>(b)</b> \(\displaystyle\lim_{N\to\infty}\left(1-\frac1{N+1}\right)=1\).</p>
 <p><b>(c)</b> \(\sum_{n\ge1}\dfrac{3}{4^n}\) es geométrica con primer término \(a=\tfrac34\) (para \(n=1\)) y razón \(r=\tfrac14\). Como \(|r|<1\):</p>
 \[ \sum_{n=1}^\infty\frac{3}{4^n}=\frac{3/4}{1-1/4}=\frac{3/4}{3/4}=1. \]

 <ul><li><b>El error es lo que falta.</b> En la telescópica, \(1-S_N=\dfrac{1}{N+1}\): para tener un error menor que 0.001 hacen falta 1000 términos. En la geométrica de (c), el error es \((1/4)^N\): con solo 5 términos ya es menor que 0.001. Las dos convergen, pero a velocidades muy distintas, y la figura lo muestra.</li>

 <li><b>Advertencia.</b> Que los términos tiendan a 0 es <i>necesario</i> pero no suficiente. Elija la serie armónica en la figura: \(1/n\to0\), pero \(S_N\approx\ln N\to\infty\).</li></ul>`};

const EX3={title:'Series de potencias: radio e intervalo de convergencia',
 stmt:R`<p>Una serie de potencias \(\sum c_n(x-a)^n\) converge en un intervalo centrado en \(a\) de radio \(R\) y diverge fuera. En los extremos \(x=a\pm R\) hay que estudiar cada caso por separado.</p>
 <p><b>Ejercicio.</b> Para \(\displaystyle\sum_{n=1}^\infty\frac{x^n}{n\,2^n}\):</p><ol class="parts" type="a"><li>Calcule el radio R.</li><li>¿Converge en \(x=-2\)? (escriba 1 si converge, 0 si no)</li><li>Usando \(\sum_{n\ge1}\frac{u^n}{n}=-\ln(1-u)\), calcule la suma en \(x=1\).</li></ol>`,
 checks:[{label:'(a) R',val:2},{label:'(b) ¿converge en x = −2? (1/0)',val:1},{label:'(c) suma en x = 1',val:Math.LN2}],
 sol:R`<h4 class="solh">Fundamento</h4>
 <ul><li><b>Criterio de la razón:</b> si \(\lim\left|\dfrac{u_{n+1}}{u_n}\right|=\rho\), la serie \(\sum u_n\) converge (absolutamente) si \(\rho<1\) y diverge si \(\rho>1\). Si \(\rho=1\), el criterio no decide.</li>
 <li><b>Serie p:</b> \(\sum 1/n^p\) converge si y solo si \(p>1\).</li>
 <li><b>Criterio de Leibniz:</b> si \(b_n\) decrece y tiende a 0, entonces \(\sum(-1)^nb_n\) converge.</li></ul>
 <h4 class="solh">Desarrollo</h4>
 <p><b>(a)</b> Aplicamos la razón a \(u_n=\dfrac{x^n}{n\,2^n}\), con x fijo:</p>
 \[ \left|\frac{u_{n+1}}{u_n}\right|=\frac{|x|^{n+1}}{(n+1)2^{n+1}}\cdot\frac{n\,2^n}{|x|^n}=\frac{|x|}{2}\cdot\frac{n}{n+1}\ \longrightarrow\ \frac{|x|}{2}. \]
 <p>La serie converge si \(\tfrac{|x|}{2}<1\), es decir si \(|x|<2\), y diverge si \(|x|>2\). Entonces \(R=2\).</p>
 <p><b>(b)</b> En los extremos la razón da \(\rho=1\) y no decide, así que hay que sustituir:</p>
 <ul><li>\(x=2\): \(\sum\dfrac{2^n}{n\,2^n}=\sum\dfrac1n\), la armónica (serie p con \(p=1\)): <b>diverge</b>.</li>
 <li>\(x=-2\): \(\sum\dfrac{(-1)^n}{n}\). Como \(b_n=\tfrac1n\) decrece y tiende a 0, por Leibniz <b>converge</b>. La convergencia es condicional: en valor absoluto es la armónica.</li></ul>
 <p>El intervalo de convergencia es \([-2,2)\).</p>
 <p><b>(c)</b> La fórmula dada sale de integrar la serie geométrica término a término: \(\sum_{n\ge1}u^{n-1}=\dfrac1{1-u}\), e integrando de 0 a u queda \(\sum_{n\ge1}\dfrac{u^n}{n}=-\ln(1-u)\) para \(|u|<1\). Con \(u=\tfrac x2\):</p>
 \[ \sum_{n=1}^\infty\frac{x^n}{n\,2^n}=\sum_{n=1}^\infty\frac{(x/2)^n}{n}=-\ln\!\left(1-\frac x2\right),\qquad x=1:\ -\ln\tfrac12=\ln2\approx0.6931. \]
 <h4 class="solh">Interpretación</h4>
 <ul><li><b>Una serie de potencias define una función, pero solo en su intervalo.</b> Aquí representa \(-\ln(1-x/2)\) en \([-2,2)\). Fuera de ese intervalo la serie no tiene suma, aunque la función sí exista (por ejemplo en \(x=-3\)). En la figura, elija esta serie y mueva x fuera del intervalo: las sumas parciales se disparan.</li>
 <li><b>Por qué R = 2.</b> La función \(-\ln(1-x/2)\) «se rompe» en \(x=2\). La serie, centrada en 0, no puede ir más allá de ese punto, y el radio es justamente la distancia del centro a ese problema.</li>
 <li><b>Uso práctico.</b> Con x = 1 obtenemos una forma de calcular \(\ln2\) sumando fracciones. Las calculadoras usan ideas de este tipo, con series elegidas para converger rápido, para calcular logaritmos y exponenciales.</li></ul>`};

function potDraw(crit){
  const s=POT[S3.i],N=S3.N,Rr=s.R,half=isFinite(Rr)?(Rr>0?2.2*Rr:2):5,x0=s.a-half,x1=s.a+half;S3.u=S3.u??0.6;const xp=x0+(x1-x0)*S3.u;
  $('#s3nv').textContent=N;$('#s3xv').textContent=fm(xp,3);
  const xs=[];for(let i=0;i<=500;i++)xs.push(x0+(x1-x0)*i/500);
  const fv=xs.map(x=>s.f(x)),sv=xs.map(x=>potS(s,x,N));
  const inside=fv.filter((v,i)=>isFinite(v)&&(!isFinite(Rr)||Rr===0||abs(xs[i]-s.a)<=0.85*Rr));let [y0,y1]=range(inside.length?inside:[-1,1],0.6);if(Rr===0){y0=-3;y1=5;}
  const P=plane($('#c2cv'),[x0,x1,y0,y1],{h:380});if(!P)return;const g=P.g,acc=tok('--accent'),mu=tok('--muted'),im=tok('--im');P.axes('x','');
  if(isFinite(Rr)&&Rr>0){g.fillStyle=rgba(im,0.12);g.fillRect(P.X(s.a-Rr),P.pad.t,P.X(s.a+Rr)-P.X(s.a-Rr),P.H-P.pad.t-P.pad.b);}
  else if(!isFinite(Rr)){g.fillStyle=rgba(im,0.08);g.fillRect(P.pad.l,P.pad.t,P.W-P.pad.l-P.pad.r,P.H-P.pad.t-P.pad.b);}
  P.clip();P.path(xs.map((x,i)=>[x,fv[i]]));g.strokeStyle=mu;g.lineWidth=4;g.globalAlpha=.55;g.stroke();g.globalAlpha=1;
  P.path(xs.map((x,i)=>[x,sv[i]]));g.strokeStyle=acc;g.lineWidth=2;g.stroke();
  const yp=potS(s,xp,N),fp=s.f(xp);g.strokeStyle=tok('--ink');g.globalAlpha=.4;g.setLineDash([3,3]);g.beginPath();g.moveTo(P.X(xp),P.pad.t);g.lineTo(P.X(xp),P.H-P.pad.b);g.stroke();g.setLineDash([]);g.globalAlpha=1;
  P.dot(xp,yp,5,acc);if(isFinite(fp))P.dot(xp,fp,4,null,mu);g.restore();
  if(isFinite(Rr)){const yb=y0+(y1-y0)*0.04;if(Rr>0){g.strokeStyle=im;g.lineWidth=3;g.beginPath();g.moveTo(P.X(s.a-Rr),P.Y(yb));g.lineTo(P.X(s.a+Rr),P.Y(yb));g.stroke();
    [[s.a-Rr,s.inc[0]],[s.a+Rr,s.inc[1]]].forEach(([x,inc])=>P.dot(x,yb,5,inc?im:tok('--panel'),im));}else P.dot(s.a,yb,5,im);}
  $('#c2leg').innerHTML='<span><span class="sw" style="background:'+rgba(mu,0.6)+'"></span>función f(x)</span><span><span class="sw acc"></span>suma parcial S<sub>N</sub>(x)</span><span><span class="sw imc"></span>intervalo de convergencia (● incluido, ○ excluido)</span>';
  const iv=!isFinite(Rr)?'(−∞, ∞)':Rr===0?'{'+fm(s.a)+'}':(s.inc[0]?'[':'(')+fm(s.a-Rr)+', '+fm(s.a+Rr)+(s.inc[1]?']':')');
  const inI=!isFinite(Rr)||(Rr>0&&abs(xp-s.a)<Rr);
  $('#c2read').innerHTML='<b>R = '+(isFinite(Rr)?fm(Rr):'∞')+'</b>  ·  intervalo de convergencia: '+iv+'. '+s.ends+
    '<br>En x = '+fm(xp,3)+': S<sub>'+N+'</sub>(x) = '+fm(yp,6)+(isFinite(fp)?'  ·  f(x) = '+fm(fp,6)+'  ·  diferencia = '+fm(fp-yp,3):'')+(inI?'  (dentro: al subir N la diferencia tiende a 0)':'  (fuera del intervalo: la serie diverge)');
  if(crit!==false){const c=$('#c2crit');c.innerHTML='\\['+s.ftex+',\\qquad R=\\lim_{n\\to\\infty}\\left|\\frac{c_n}{c_{n+1}}\\right|='+(isFinite(Rr)?Rr:'\\infty')+'\\]';typeset(c);}
}

/* =================== 4. Polinomios de Taylor =================== */
const TAY=[
 {name:'eˣ',f:Math.exp,tex:'e^x',d:(k,a)=>Math.exp(a),sing:null,ar:[-2,2]},
 {name:'sen x',f:Math.sin,tex:'\\operatorname{sen} x',d:(k,a)=>Math.sin(a+k*PI/2),sing:null,ar:[-3,3]},
 {name:'cos x',f:Math.cos,tex:'\\cos x',d:(k,a)=>Math.cos(a+k*PI/2),sing:null,ar:[-3,3]},
 {name:'ln(1 + x)',f:x=>x>-1?Math.log(1+x):NaN,tex:'\\ln(1+x)',d:(k,a)=>k===0?Math.log(1+a):(k%2?1:-1)*fact(k-1)/Math.pow(1+a,k),sing:-1,ar:[-0.6,2]},
 {name:'1 / (1 − x)',f:x=>1/(1-x),tex:'\\frac{1}{1-x}',d:(k,a)=>fact(k)/Math.pow(1-a,k+1),sing:1,ar:[-2,0.6]},
 {name:'√(1 + x)',f:x=>x>=-1?sq(1+x):NaN,tex:'\\sqrt{1+x}',d:(k,a)=>{let c=1;for(let j=0;j<k;j++)c*=(0.5-j);return c*Math.pow(1+a,0.5-k);},sing:-1,ar:[-0.6,2]}
];
const S4={i:0,n:3,a:0,u:0.7};
const EX4={title:'Polinomios de Taylor',
 stmt:R`<p>El polinomio de Taylor de orden n de \(f\) en torno a \(a\) es</p>\[ P_n(x)=\sum_{k=0}^{n}\frac{f^{(k)}(a)}{k!}\,(x-a)^k . \]<p>Cerca de \(a\) aproxima a \(f\), y la aproximación mejora al subir n, pero solo dentro del intervalo de convergencia de la serie de Taylor.</p>
 <p><b>Ejercicio.</b></p><ol class="parts" type="a"><li>Con el polinomio de orden 3 de \(e^x\) en \(a=0\), aproxime \(e^{0.5}\).</li><li>¿Cuál es el coeficiente de \(x^5\) en la serie de Maclaurin de \(\operatorname{sen}x\)?</li><li>Con el polinomio de orden 2 de \(\sqrt{1+x}\) en \(a=0\), aproxime \(\sqrt{1.2}\).</li></ol>`,
 checks:[{label:'(a) P₃(0.5)',val:1.6458333},{label:'(b) coeficiente de x⁵',val:1/120},{label:'(c) P₂(0.2)',val:1.095}],
 sol:R`<h4 class="solh">Fundamento</h4>
 <ul><li><b>Construcción:</b> \(P_n\) es el único polinomio de grado ≤ n que coincide con \(f\) en \(a\), junto con sus primeras n derivadas. Por eso su coeficiente k-ésimo es \(f^{(k)}(a)/k!\).</li>
 <li><b>Teorema de Taylor (resto de Lagrange):</b> \(f(x)=P_n(x)+R_n(x)\), con \(R_n(x)=\dfrac{f^{(n+1)}(\xi)}{(n+1)!}(x-a)^{n+1}\) para algún \(\xi\) entre \(a\) y \(x\). Esto permite <i>acotar el error</i> sin conocer el valor exacto.</li></ul>
 <h4 class="solh">Desarrollo</h4>
 <p><b>(a)</b> Todas las derivadas de \(e^x\) son \(e^x\), y en 0 valen 1:</p>
 \[ P_3(x)=1+x+\frac{x^2}{2!}+\frac{x^3}{3!},\qquad P_3(0.5)=1+0.5+0.125+0.020833=1.645833. \]
 <p><i>Cota del error:</i> \(|R_3(0.5)|=\dfrac{e^{\xi}}{4!}(0.5)^4\le\dfrac{e^{0.5}}{24}\cdot0.0625<\dfrac{2\cdot0.0625}{24}\approx0.0052\). El error real es \(e^{0.5}-P_3(0.5)\approx0.0029\), dentro de la cota.</p>
 <p><b>(b)</b> Las derivadas de \(\operatorname{sen}x\) se repiten cada cuatro: \(\operatorname{sen},\ \cos,\ -\operatorname{sen},\ -\cos\). En 0 valen \(0,1,0,-1,0,1,\dots\), así que \(f^{(5)}(0)=1\) y el coeficiente es \(\dfrac{1}{5!}=\dfrac1{120}\). Solo aparecen potencias impares, porque \(\operatorname{sen}\) es una función impar.</p>
 <p><b>(c)</b> Con \(f(x)=(1+x)^{1/2}\):</p>
 \[ f(0)=1,\quad f'(x)=\tfrac12(1+x)^{-1/2}\Rightarrow f'(0)=\tfrac12,\quad f''(x)=-\tfrac14(1+x)^{-3/2}\Rightarrow f''(0)=-\tfrac14. \]
 \[ P_2(x)=1+\frac x2+\frac{-1/4}{2!}x^2=1+\frac x2-\frac{x^2}{8},\qquad P_2(0.2)=1+0.1-0.005=1.095. \]
 <p>El valor real es \(\sqrt{1.2}=1.095445\), así que el error es menor que 0.0005.</p>
 <h4 class="solh">Interpretación</h4>
 <ul><li><b>Cada orden agrega información.</b> \(P_1\) es la recta tangente (la linealización), \(P_2\) agrega la curvatura, y así sucesivamente. En la figura, suba n y vea cómo el polinomio se pega a la función en un intervalo cada vez mayor.</li>
 <li><b>En física se usa todo el tiempo.</b> \(\operatorname{sen}\theta\approx\theta\) (orden 1) convierte la ecuación del péndulo en la de un resorte: es la aproximación del Problema 6 de EDO. \(\sqrt{1+x}\approx1+\tfrac x2\) aparece en relatividad y en óptica.</li>
 <li><b>El límite de la aproximación.</b> Elija \(\ln(1+x)\) y suba n. Para \(x>1\) el polinomio se aleja cada vez más, porque la serie solo converge en \((-1,1]\). Más términos no siempre es mejor: depende de dónde se evalúe.</li></ul>`};
function tayCtl(){
  const t=TAY[S4.i],c=$('#c2ctl');
  c.innerHTML='<div class="field"><label for="s4p">Función</label><select id="s4p">'+TAY.map((x,i)=>'<option value="'+i+'">'+x.name+'</option>').join('')+'</select></div>'+
   '<div class="slider"><label for="s4n">orden n</label><input type="range" id="s4n" min="0" max="20" value="'+S4.n+'"><output id="s4nv"></output></div>'+
   '<div class="slider"><label for="s4a">centro a</label><input type="range" id="s4a" min="'+t.ar[0]+'" max="'+t.ar[1]+'" step="0.05" value="'+S4.a+'"><output id="s4av"></output></div>'+
   '<div class="slider"><label for="s4x">x</label><input type="range" id="s4x" min="0" max="1000" value="'+Math.round(S4.u*1000)+'"><output id="s4xv"></output></div>';
  $('#s4p').value=S4.i;$('#s4p').addEventListener('change',e=>{S4.i=+e.target.value;S4.a=0;tayCtl();tayDraw(true);});
  $('#s4n').addEventListener('input',e=>{S4.n=+e.target.value;tayDraw(true);});$('#s4a').addEventListener('input',e=>{S4.a=+e.target.value;tayDraw(true);});
  $('#s4x').addEventListener('input',e=>{S4.u=e.target.value/1000;tayDraw(false);});
}
let tT=null;
function tayDraw(crit){
  const t=TAY[S4.i],n=S4.n,a=S4.a,cs=[];for(let k=0;k<=n;k++)cs.push(t.d(k,a)/fact(k));
  const Pn=x=>{let s=0,p=1;for(let k=0;k<=n;k++){s+=cs[k]*p;p*=(x-a);}return s;};
  const Rr=t.sing==null?Infinity:abs(a-t.sing),x0=t.sing==null?a-6:Math.min(a-2.2*Rr,t.sing+0.02)-0.3,x1=t.sing==null?a+6:a+2.2*Rr;
  const xa=t.sing===-1?Math.max(x0,-0.99):x0;const xs=[];for(let i=0;i<=500;i++)xs.push(xa+(x1-xa)*i/500);
  const fv=xs.map(t.f),pv=xs.map(Pn);let [y0,y1]=range(fv,0.3);if(t.sing===1){y0=Math.max(y0,-3);y1=Math.min(Math.max(y1,3),8);}
  const xp=xa+(x1-xa)*S4.u;$('#s4nv').textContent=n;$('#s4av').textContent=fm(a,2);$('#s4xv').textContent=fm(xp,3);
  const P=plane($('#c2cv'),[xa,x1,y0,y1],{h:380});if(!P)return;const g=P.g,acc=tok('--accent'),mu=tok('--muted'),im=tok('--im');P.axes('x','y');
  if(isFinite(Rr)){g.fillStyle=rgba(im,0.12);g.fillRect(P.X(Math.max(xa,a-Rr)),P.pad.t,P.X(a+Rr)-P.X(Math.max(xa,a-Rr)),P.H-P.pad.t-P.pad.b);}
  P.clip();P.path(xs.map((x,i)=>[x,fv[i]]));g.strokeStyle=mu;g.lineWidth=4;g.globalAlpha=.55;g.stroke();g.globalAlpha=1;
  P.path(xs.map((x,i)=>[x,pv[i]]));g.strokeStyle=acc;g.lineWidth=2;g.stroke();
  P.dot(a,t.f(a),5,tok('--num'));const yp=Pn(xp),fp=t.f(xp);g.strokeStyle=tok('--ink');g.globalAlpha=.4;g.setLineDash([3,3]);g.beginPath();g.moveTo(P.X(xp),P.pad.t);g.lineTo(P.X(xp),P.H-P.pad.b);g.stroke();g.setLineDash([]);g.globalAlpha=1;
  P.dot(xp,yp,5,acc);if(isFinite(fp))P.dot(xp,fp,4,null,mu);g.restore();
  $('#c2leg').innerHTML='<span><span class="sw" style="background:'+rgba(mu,0.6)+'"></span>f(x) = '+t.name+'</span><span><span class="sw acc"></span>P<sub>'+n+'</sub>(x)</span><span><span class="sw num"></span>centro a</span>'+(isFinite(Rr)?'<span><span class="sw imc"></span>intervalo de convergencia |x − a| &lt; '+fm(Rr,3)+'</span>':'');
  $('#c2read').innerHTML='En x = '+fm(xp,4)+': P<sub>'+n+'</sub>(x) = '+fm(yp,6)+'  ·  f(x) = '+fm(fp,6)+'  ·  error = '+fm(abs(fp-yp),3)+
    (isFinite(Rr)?'<br>La serie de Taylor converge solo para |x − a| &lt; '+fm(Rr,3)+' (distancia de a a la singularidad x = '+t.sing+'). Fuera de esa franja, subir n no mejora la aproximación.':'<br>La serie de Taylor de '+t.name+' converge para todo x: subiendo n, el polinomio se ajusta en intervalos cada vez más grandes.');
  if(crit!==false){clearTimeout(tT);tT=setTimeout(()=>{const terms=[];const xa2=abs(a)<1e-12?'x':'(x'+(a>0?'-':'+')+fm(abs(a),2)+')';
    cs.forEach((c,k)=>{if(abs(c)<1e-12)return;const cf=Number(c.toPrecision(4));const body=k===0?'':k===1?xa2:xa2+'^{'+k+'}';terms.push({c:cf,b:body});});
    let s='';terms.slice(0,7).forEach((q,j)=>{const neg=q.c<0,m=abs(q.c),co=q.b&&abs(m-1)<1e-12?'':String(m);s+=(j?(neg?' - ':' + '):(neg?'-':''))+co+(co&&q.b?'\\,':'')+q.b;});if(terms.length>7)s+=' + \\cdots';
    const el=$('#c2crit');el.innerHTML='\\[ P_{'+n+'}(x)='+(s||'0')+' \\]';typeset(el);},150);}
}

const C2V={"EX1": ["Para la misma sucesión, ¿qué N necesita ε = 0.001? Compruebe la estimación \\(N\\approx3/(4\\varepsilon)\\).", "Elija \\(a_n=\\operatorname{sen}(n)/n\\) en la figura: ¿por qué N salta de forma irregular al mover ε?", "Con \\(a_n=(-1)^n\\), explique con la definición por qué ningún L sirve."], "EX2": ["¿Cuántos términos de la telescópica hacen falta para que el error sea menor que 0.001? ¿Y para la geométrica de (c)?", "En la figura, ponga la geométrica con r = 0.95 y con r = −0.95: ¿cuál converge más lento? ¿Por qué oscila una de ellas?", "Con la serie p, busque el menor p con el que S₂₀₀ parece haberse estabilizado. ¿Es una prueba de convergencia?"], "EX3": ["Calcule el radio de \\(\\sum\\frac{x^n}{n^2\\,3^n}\\). ¿Converge en ambos extremos?", "Con la serie \\(\\sum x^n/n!\\) de la figura, ¿qué N hace falta para aproximar \\(e^3\\) con error menor que 0.01?", "¿Qué serie de potencias, centrada en 0, representa \\(\\ln(1+x)\\)? (Cambie x por −x en la fórmula usada)."], "EX4": ["¿Qué orden n necesita \\(P_n\\) de \\(e^x\\) en 0 para aproximar e con error menor que 0.001? Use la cota del resto.", "Aproxime \\(\\operatorname{sen}(0.5)\\) con \\(P_3\\) y acote el error. ¿Por qué \\(P_3\\) y \\(P_4\\) dan lo mismo para el seno?", "En la figura, centre \\(\\ln(1+x)\\) en a = 1: ¿cambia el radio de convergencia? ¿Por qué?"]};EX1.vars=C2V.EX1;EX2.vars=C2V.EX2;EX3.vars=C2V.EX3;EX4.vars=C2V.EX4;
/* =================== navegación =================== */
const TOOLS={'calc2-sucesiones':{h:'Sucesiones',lede:'Una sucesión es una lista infinita de números. ¿A qué valor se acercan sus términos? La definición ε–N lo hace preciso.',vh:'Términos de la sucesión y franja L ± ε',hint:'Mueva ε y vea desde qué N los términos quedan en la franja',ex:EX1,ctl:sucCtl,draw:sucDraw},
 'calc2-series':{h:'Series numéricas',lede:'Sumar infinitos términos tiene sentido si las sumas parciales se acercan a un número. Compare series que convergen y que divergen.',vh:'Términos y sumas parciales',hint:'Elija una serie y aumente N',ex:EX2,ctl:serCtl,draw:()=>serDraw(true)},
 'calc2-potencias':{h:'Series de potencias',lede:'Una serie de potencias define una función en su intervalo de convergencia. Fuera de él, las sumas parciales se separan sin control.',vh:'Sumas parciales y la función que representan',hint:'Aumente N y mueva x dentro y fuera del intervalo',ex:EX3,ctl:potCtl,draw:()=>potDraw(true)},
 'calc2-taylor':{h:'Polinomios de Taylor',lede:'Los polinomios de Taylor aproximan una función cerca de un punto usando sus derivadas. Al subir el orden, la aproximación mejora dentro del radio de convergencia.',vh:'f(x) y su polinomio de Taylor',hint:'Suba el orden y mueva el centro',ex:EX4,ctl:tayCtl,draw:()=>tayDraw(true)}};
let CUR=null,ON=false;
function show(id){
  if(!TOOLS[id])id='calc2-sucesiones';const T=TOOLS[id];CUR=id;
  $$('#c2topics a').forEach(a=>{if(a.getAttribute('href')==='#'+id)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  $('#c2h1').textContent=T.h;$('#c2lede').textContent=T.lede;$('#c2vh').textContent=T.vh;$('#c2hint').textContent=T.hint;
  const w=$('#c2worked');w.innerHTML='<h2>'+T.ex.title+'</h2><div class="stmt">'+T.ex.stmt+'</div><div class="anscheck"></div><details class="sol"><summary>Ver desarrollo</summary>'+T.ex.sol+(T.ex.vars?'<h4 class="solh">Variaciones para analizar</h4><ol class="vars">'+T.ex.vars.map(s=>'<li>'+s+'</li>').join('')+'</ol>':'')+'</details>';
  checks(w.querySelector('.anscheck'),T.ex.checks);typeset(w);
  const ct=$('#ctab-calc2');if(ct)ct.setAttribute('href','#'+id);
  T.ctl();T.draw();
}
function route(){const h=location.hash.slice(1);if(h.startsWith('calc2-')){ON=true;show(h);}else{ON=false;if(!$('#tab-calc2').hidden)show(CUR||'calc2-sucesiones');}}
window.addEventListener('hashchange',route);
window.addEventListener('coursetab',ev=>{if(ev.detail==='tab-calc2'){const h=location.hash.slice(1);if(!h.startsWith('calc2-'))show(CUR||'calc2-sucesiones');}});
new ResizeObserver(()=>{if(CUR&&!$('#tab-calc2').hidden){const T=TOOLS[CUR];if(CUR==='calc2-sucesiones')sucDraw();else if(CUR==='calc2-series')serDraw(false);else if(CUR==='calc2-potencias')potDraw(false);else tayDraw(false);}}).observe($('#c2cv').parentElement);
route();
})();
</script>
